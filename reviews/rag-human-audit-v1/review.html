tion') await options.waitForRetry(ref.count, options.signal);\n    }\n  }\n}\n\nmodule.exports = { parseConfig, candidateConfig, selection, failureReason, run };\n","electron/tools/outputSchema.cjs":"/**\n * Tool output contracts describe AgentToolResult.data, not the result envelope.\n * This intentionally supports a bounded JSON Schema subset. Unsupported assertions\n * are rejected at registration, never silently treated as a passing contract.\n * No remote refs, schema-driven code execution, or input-array fallback caps.\n */\n'use strict';\n\nconst { isDeepStrictEqual } = require('node:util');\nconst TYPES = new Set(['null', 'boolean', 'object', 'array', 'number', 'integer', 'string']);\nconst ANNOTATIONS = new Set(['$schema', '$id', '$comment', 'title', 'description', 'default', 'examples', 'deprecated', 'readOnly', 'writeOnly']);\nconst KEYWORDS = new Set([\n  '$ref', '$defs', 'definitions', 'type', 'enum', 'const', 'allOf', 'anyOf', 'oneOf', 'not',\n  'if', 'then', 'else', 'properties', 'patternProperties', 'additionalProperties', 'required',\n  'minProperties', 'maxProperties', 'items', 'additionalItems', 'prefixItems', 'contains',\n  'minContains', 'maxContains', 'minItems', 'maxItems', 'uniqueItems', 'minLength', 'maxLength',\n  'pattern', 'minimum', 'maximum', 'exclusiveMinimum', 'exclusiveMaximum', 'multipleOf',\n]);\nconst LIMIT = 100000;\nconst MAX_DEPTH = 64;\nconst own = (value, key) => Object.prototype.hasOwnProperty.call(value, key);\nconst object = (value) => value !== null && typeof value === 'object' && !Array.isArray(value);\n\n/** Reject non-JSON data instead of allowing serialization to change its meaning. */\nfunction jsonIssue(value, path = '$', ancestors = new Set(), budget = { left: LIMIT }, depth = 0) {\n  if (--budget.left \u003c 0 || depth > MAX_DEPTH) return { path, keyword: 'limit', message: 'JSON 结构超过校验深度或节点上限' };\n  if (value === null || typeof value === 'string' || typeof value === 'boolean') return null;\n  if (typeof value === 'number' && Number.isFinite(value)) return null;\n  if (typeof value !== 'object') return { path, keyword: 'json', message: '输出必须是可序列化的 JSON 值' };\n  if (ancestors.has(value)) return { path, keyword: 'json', message: '输出存在循环引用' };\n  if (!Array.isArray(value) && Object.getPrototypeOf(value) !== Object.prototype && Object.getPrototypeOf(value) !== null) {\n    return { path, keyword: 'json', message: '输出必须是普通 JSON 对象' };\n  }\n  ancestors.add(value);\n  try {\n    if (Array.isArray(value) && value.length > budget.left) return { path, keyword: 'limit', message: 'JSON 结构超过校验节点上限' };\n    const keys = Array.isArray(value) ? Array.from({ length: value.length }, (_, i) => String(i)) : Object.keys(value);\n    if (keys.length > budget.left) return { path, keyword: 'limit', message: 'JSON 结构超过校验节点上限' };\n    for (const key of keys) {\n      const entry = Object.getOwnPropertyDescriptor(value, key);\n      if (!entry || !own(entry, 'value')) return { path: path + '.' + key, keyword: 'json', message: 'JSON 值不能包含空数组项或访问器' };\n      // Tool payloads use optional object fields with undefined. JSON omits these\n      // fields on the wire; required checks below still treat them as absent.\n      if (!Array.isArray(value) && entry.value === undefined) continue;\n      const issue = jsonIssue(entry.value, path + (Array.isArray(value) ? '[' + key + ']' : '.' + key), ancestors, budget, depth + 1);\n      if (issue) return issue;\n    }\n    return null;\n  } finally { ancestors.delete(value); }\n}\n\nfunction resolveRef(root, reference) {\n  if (reference === '#') return root;\n  if (typeof reference !== 'string' || !reference.startsWith('#/')) throw new Error('仅支持文档内 JSON Pointer $ref');\n  let target = root;\n  for (const part of reference.slice(2).split('/')) {\n    const key = decodeURIComponent(part).replace(/~1/g, '/').replace(/~0/g, '~');\n    if ((!object(target) && !Array.isArray(target)) || !own(target, key)) throw new Error('$ref 目标不存在');\n    target = target[key];\n  }\n  return target;\n}\n\n/** Validate and freeze the schema once, before the executor can have side effects. */\nfunction normalizeOutputSchema(input) {\n  if (input == null || input === 'none') return null;\n  const issue = jsonIssue(input);\n  if (issue) throw new Error('outputSchema ' + issue.path + ': ' + issue.message);\n  const root = JSON.parse(JSON.stringify(input));\n  const visited = new Set();\n  function visit(schema, path) {\n    if (typeof schema === 'boolean') return;\n    if (!object(schema)) throw new Error('outputSchema ' + path + ': schema 必须是对象或布尔值');\n    if (visited.has(schema)) return;\n    visited.add(schema);\n    const reject = (message) => { throw new Error('outputSchema ' + path + ': ' + message); };\n    for (const key of Object.keys(schema)) {\n      if (!KEYWORDS.has(key) && !ANNOTATIONS.has(key)) reject('不支持关键字 ' + key);\n    }\n    if (own(schema, 'type')) {\n      const types = Array.isArray(schema.type) ? schema.type : [schema.type];\n      if (!types.length || types.some((type) => !TYPES.has(type)) || new Set(types).size !== types.length) reject('type 声明不合法');\n    }\n    if (own(schema, 'enum') && (!Array.isArray(schema.enum) || !schema.enum.length)) reject('enum 必须是非空数组');\n    for (const key of ['minLength', 'maxLength', 'minItems', 'maxItems', 'minProperties', 'maxProperties', 'minContains', 'maxContains']) {\n      if (own(schema, key) && (!Number.isInteger(schema[key]) || schema[key] \u003c 0)) reject(key + ' 必须是非负整数');\n    }\n    for (const key of ['minimum', 'maximum', 'exclusiveMinimum', 'exclusiveMaximum', 'multipleOf']) {\n      if (own(schema, key) && (typeof schema[key] !== 'number' || !Number.isFinite(schema[key]))) reject(key + ' 必须是有限数值');\n    }\n    if (own(schema, 'multipleOf') && schema.multipleOf \u003c= 0) reject('multipleOf 必须大于零');\n    if (own(schema, 'uniqueItems') && typeof schema.uniqueItems !== 'boolean') reject('uniqueItems 必须是布尔值');\n    if (own(schema, 'required') && (!Array.isArray(schema.required) || schema.required.some((key) => typeof key !== 'string') || new Set(schema.required).size !== schema.required.length)) reject('required 必须是无重复的字段名数组');\n    if (own(schema, 'pattern')) {\n      if (typeof schema.pattern !== 'string') reject('pattern 必须是字符串');\n      try { new RegExp(schema.pattern, 'u'); } catch { reject('pattern 不是有效正则表达式'); }\n    }\n    for (const key of ['properties', 'patternProperties', '$defs', 'definitions']) {\n      if (!own(schema, key)) continue;\n      if (!object(schema[key])) reject(key + ' 必须是对象');\n      for (const [name, child] of Object.entries(schema[key])) {\n        if (key === 'patternProperties') {\n          try { new RegExp(name, 'u'); } catch { reject('patternProperties 含无效正则表达式'); }\n        }\n        visit(child, path + '.' + key + '.' + name);\n      }\n    }\n    for (const key of ['allOf', 'anyOf', 'oneOf', 'prefixItems']) {\n      if (!own(schema, key)) continue;\n      if (!Array.isArray(schema[key]) || !schema[key].length) reject(key + ' 必须是非空 schema 数组');\n      schema[key].forEach((child, i) => visit(child, path + '.' + key + '[' + i + ']'));\n    }\n    for (const key of ['not', 'if', 'then', 'else', 'additionalProperties', 'additionalItems', 'contains']) {\n      if (own(schema, key)) visit(schema[key], path + '.' + key);\n    }\n    if (own(schema, 'items')) {\n      if (Array.isArray(schema.items)) {\n        if (schema.prefixItems) reject('不能同时声明 tuple items 和 prefixItems');\n        schema.items.forEach((child, i) => visit(child, path + '.items[' + i + ']'));\n      } else visit(schema.items, path + '.items');\n    }\n    if (own(schema, '$ref')) {\n      let target;\n      try { target = resolveRef(root, schema.$ref); } catch (error) { reject(error.message); }\n      visit(target, path + '.$ref');\n    }\n  }\n  visit(root, '$');\n  function freeze(value) {\n    if (value && typeof value === 'object') {\n      Object.values(value).forEach(freeze);\n      Object.freeze(value);\n    }\n    return value;\n  }\n  return freeze(root);\n}\n\nfunction typeMatches(value, type) {\n  if (type === 'null') return value === null;\n  if (type === 'array') return Array.isArray(value);\n  if (type === 'object') return object(value);\n  if (type === 'integer') return Number.isInteger(value);\n  if (type === 'number') return typeof value === 'number' && Number.isFinite(value);\n  return typeof value === type;\n}\n\n/** @returns {{path: string, keyword: string, message: string}|null} */\nfunction validateOutput(value, schema) {\n  if (schema == null || schema === 'none') return null;\n  const issue = jsonIssue(value, '$.data');\n  if (issue) return issue;\n  const budget = { left: LIMIT };\n  function check(data, rule, path, depth = 0) {\n    const error = (keyword, message) => ({ path, keyword, message });\n    if (--budget.left \u003c 0 || depth > MAX_DEPTH) return error('limit', '输出校验超过深度或节点上限');\n    if (rule === true) return null;\n    if (rule === false) return error('falseSchema', '此输出被 schema 禁止');\n    const descend = (child, childData = data, childPath = path) => check(childData, child, childPath, depth + 1);\n    if (own(rule, '$ref')) { const found = descend(resolveRef(schema, rule.$ref)); if (found) return found; }\n    if (own(rule, 'type') && !(Array.isArray(rule.type) ? rule.type : [rule.type]).some((type) => typeMatches(data, type))) return error('type', '输出字段类型不符合 schema');\n    if (own(rule, 'const') && !isDeepStrictEqual(data, rule.const)) return error('const', '输出不符合指定常量');\n    if (rule.enum && !rule.enum.some((item) => isDeepStrictEqual(data, item))) return error('enum', '输出不在声明的枚举中');\n    for (const child of rule.allOf || []) { const found = descend(child); if (found) return found; }\n    if (rule.anyOf || rule.oneOf) {\n      for (const key of ['anyOf', 'oneOf']) {\n        if (!rule[key]) continue;\n        const branches = rule[key].map((child) => descend(child));\n        const limit = branches.find((entry) => entry && entry.keyword === 'limit');\n        if (limit) return limit;\n        const matched = branches.filter((entry) => entry === null).length;\n        if (key === 'anyOf' ? matched === 0 : matched !== 1) return error(key, '输出不符合 schema 分支条件');\n      }\n    }\n    if (own(rule, 'not')) {\n      const found = descend(rule.not);\n      if (found && found.keyword === 'limit') return found;\n      if (!found) return error('not', '输出匹配了禁止的 schema');\n    }\n    if (own(rule, 'if')) {\n      const found = descend(rule.if);\n      if (found && found.keyword === 'limit') return found;\n      const branch = found ? 'else' : 'then';\n      if (own(rule, branch)) { const branchError = descend(rule[branch]); if (branchError) return branchError; }\n    }\n    if (typeof data === 'string') {\n      const length = [...data].length;\n      if (rule.minLength != null && length \u003c rule.minLength) return error('minLength', '输出字符串过短');\n      if (rule.maxLength != null && length > rule.maxLength) return error('maxLength', '输出字符串过长');\n      if (rule.pattern != null && !new RegExp(rule.pattern, 'u').test(data)) return error('pattern', '输出字符串不符合模式');\n    }\n    if (typeof data === 'number') {\n      /** @type {Array\u003c[string, boolean]>} */\n      const bounds = [['minimum', data \u003c rule.minimum], ['maximum', data > rule.maximum], ['exclusiveMinimum', data \u003c= rule.exclusiveMinimum], ['exclusiveMaximum', data >= rule.exclusiveMaximum]];\n      for (const [key, bad] of bounds) {\n        if (rule[key] != null && bad) return error(key, '输出数字超出声明范围');\n      }\n      if (rule.multipleOf != null) {\n        const ratio = data / rule.multipleOf;\n        if (!Number.isFinite(ratio) || Math.abs(ratio - Math.round(ratio)) > 1e-10) return error('multipleOf', '输出数字不符合倍数约束');\n      }\n    }\n    if (Array.isArray(data)) {\n      if (rule.minItems != null && data.length \u003c rule.minItems) return error('minItems', '输出数组项目过少');\n      if (rule.maxItems != null && data.length > rule.maxItems) return error('maxItems', '输出数组项目过多');\n      if (rule.uniqueItems) {\n        for (let i = 0; i \u003c data.length; i++) {\n          for (let j = 0; j \u003c i; j++) {\n            if (--budget.left \u003c 0) return error('limit', '输出校验超过节点上限');\n            if (isDeepStrictEqual(data[i], data[j])) return error('uniqueItems', '输出数组包含重复项目');\n          }\n        }\n      }\n      const tuple = rule.prefixItems || (Array.isArray(rule.items) ? rule.items : null);\n      for (let i = 0; i \u003c data.length; i++) {\n        const itemRule = tuple ? (i \u003c tuple.length ? tuple[i] : rule.prefixItems ? rule.items : rule.additionalItems) : rule.items;\n        if (itemRule !== undefined) { const found = descend(itemRule, data[i], path + '[' + i + ']'); if (found) return found; }\n      }\n      if (own(rule, 'contains')) {\n        let count = 0;\n        for (let i = 0; i \u003c data.length; i++) {\n          const found = descend(rule.contains, data[i], path + '[' + i + ']');\n          if (found && found.keyword === 'limit') return found;\n          if (!found) count++;\n        }\n        if (count \u003c (rule.minContains == null ? 1 : rule.minContains) || (rule.maxContains != null && count > rule.maxContains)) return error('contains', '输出数组不符合 contains 数量约束');\n      }\n    }\n    if (object(data)) {\n      const keys = Object.keys(data).filter((key) => data[key] !== undefined);\n      if (rule.minProperties != null && keys.length \u003c rule.minProperties) return error('minProperties', '输出对象字段过少');\n      if (rule.maxProperties != null && keys.length > rule.maxProperties) return error('maxProperties', '输出对象字段过多');\n      for (const key of rule.required || []) {\n        if (!own(data, key) || data[key] === undefined) return { path: path + '.' + key, keyword: 'required', message: '输出缺少必填字段' };\n      }\n      for (const key of keys) {\n        let matched = false;\n        if (rule.properties && own(rule.properties, key)) {\n          matched = true;\n          const found = descend(rule.properties[key], data[key], path + '.' + key);\n          if (found) return found;\n        }\n        for (const [pattern, child] of Object.entries(rule.patternProperties || {})) {\n          if (!new RegExp(pattern, 'u').test(key)) continue;\n          matched = true;\n          const found = descend(child, data[key], path + '.' + key);\n          if (found) return found;\n        }\n        if (!matched && own(rule, 'additionalProperties')) {\n          const found = descend(rule.additionalProperties, data[key], path + '.' + key);\n          if (found) return found;\n        }\n      }\n    }\n    return null;\n  }\n  return check(value, schema, '$.data');\n}\n\nmodule.exports = { normalizeOutputSchema, validateOutput };\n","electron/sideEffects.cjs":"/**\n * sideEffects.cjs —— 副作用幂等账本\n *\n * 解决审阅缺口：「对崩溃时结果未知的写操作，必须人工确认或通过幂等查询核对，不盲目重放」。\n *\n * 机制：\n *   1. 每个工具按副作用类别分类：read（可安全重放）/ write（幂等键去重）/ unknown（外部不可知副作用，如 shell）；\n *   2. write 类工具在「执行前」登记意图（intent），「执行后」提交（commit）。崩溃在两者之间 →\n *      该步骤状态为 uncommitted，续跑时不能凭猜测重放；\n *   3. 幂等键 = sha256(幂等作用域 + 工具名 + 规范化参数)。续跑时幂等作用域沿用「原 Run 的 runId」，\n *      因此原 Run 已提交过的写操作会被识别为「已完成」，直接跳过并返回历史结果，不会产生第二次副作用；\n *   4. 账本用 atomicFile 落盘（先 fsync 再替换），崩溃不会留下半截文件；\n *   5. unknown 类副作用永远不会被自动跳过或自动重放 —— 只会进入 needs_review。\n */\n'use strict';\n\nconst fs = require('fs');\nconst path = require('path');\nconst crypto = require('crypto');\nconst { atomicWriteFile } = require('./atomicFile.cjs');\nconst { redact } = require('./redaction.cjs');\n\n/** 只读工具：可安全重复执行（结果相同，不产生副作用） */\nconst READ_TOOLS = new Set([\n  'read_file', 'list_directory', 'find_files', 'search_files', 'scan_project', 'analyze_project',\n  'get_workbench_model', 'query_scalars', 'project_info', 'code_review', 'retrieve_context',\n  'read_project', 'read_run', 'poll_job', 'ask_user', 'user_memory_read',\n]);\n\n/** 写工具：本地状态变更，幂等键可去重 */\nconst WRITE_TOOLS = new Set([\n  'write_file', 'edit_file', 'bulk_edit', 'write_analysis_md', 'workbench_edit',\n  'save_project', 'memory_save', 'user_memory_save', 'apply_patch', 'rename_file', 'review_subagent_result',\n]);\n\n/** 外部副作用（不可完全观测）：永不自动重放，只做人工核对 */\nconst UNKNOWN_TOOLS = new Set([\n  'execute_shell', 'run_project', 'delegate_subagent', 'subagent', 'ui_control', 'run_workflow',\n]);\n\nfunction classify(toolName) {\n  const name = String(toolName || '').trim();\n  if (!name) return 'unknown';\n  if (READ_TOOLS.has(name)) return 'read';\n  if (WRITE_TOOLS.has(name)) return 'write';\n  if (UNKNOWN_TOOLS.has(name)) return 'unknown';\n  // 未登记的工具按最保守处理：未知副作用\n  return 'unknown';\n}\n\nfunction digest(value) {\n  let text;\n  try {\n    text = typeof value === 'string' ? value : JSON.stringify(value == null ? {} : value);\n  } catch {\n    text = String(value);\n  }\n  return crypto.createHash('sha256').update(String(text)).digest('hex').slice(0, 32);\n}\n\n/**\n * 规范化序列化：对象键排序后再 JSON 化，使「语义相同、键序不同」的参数得到同一个字符串。\n * 口径必须与 agent.cjs 的 canonicalArgs（缓存键）一致：两处不一致会出现\n * 「缓存判定为重复、幂等账本判定为新操作」，续跑时重复执行同一写操作（重复副作用）。\n * @param {any} args\n * @returns {string}\n */\nfunction canonicalArgsText(args) {\n  if (typeof args === 'string') {\n    try {\n      return canonicalArgsText(JSON.parse(args));\n    } catch {\n      return args.trim();\n    }\n  }\n  const sort = (value) => {\n    if (Array.isArray(value)) return value.map(sort);\n    if (value && typeof value === 'object') {\n      return Object.keys(value).sort().reduce((acc, key) => {\n        acc[key] = sort(value[key]);\n        return acc;\n      }, {});\n    }\n    return value;\n  };\n  try {\n    return JSON.stringify(sort(args == null ? {} : args));\n  } catch {\n    return String(args);\n  }\n}\n\nfunction idempotencyKey(scopeRunId, toolName, args) {\n  return digest(String(scopeRunId || '') + '\\u0000' + String(toolName || '') + '\\u0000' + canonicalArgsText(args));\n}\n\n/**\n * 目标文件的**状态指纹**：`f:\u003cmtime 毫秒>:\u003csize>`，不存在则 `absent`。\n * 用 mtime+size 而不是内容哈希：一次 `stat` 就够，且足以发现「两次调用之间目标被改过」——\n * 正是这种「参数没变、前置状态变了」让幂等去重变成**虚假成功**。\n * @param {any} projectRoot\n * @param {string} relPath\n * @returns {string}\n */\nfunction fileStateDigest(projectRoot, relPath) {\n  try {\n    const stat = fs.statSync(path.resolve(projectRoot || '.', String(relPath)));\n    return 'f:' + Math.floor(stat.mtimeMs) + ':' + stat.size;\n  } catch {\n    return 'absent';\n  }\n}\n\nfunction ledgerPath(projectRoot, scopeRunId) {\n  const safe = String(scopeRunId || 'unscoped').replace(/[^A-Za-z0-9._-]/g, '_');\n  return path.join(path.resolve(projectRoot || '.'), '.codenode', 'runs', safe + '.side-effects.json');\n}\n\n/** 前像正文的上限（超过就只记哈希，标记不可回滚 —— 宁可如实说「撤不了」，也不留半个文件） */\nconst BEFORE_IMAGE_CAP = 262144;\n\n/** 前像 blob 目录（内容寻址：同一份内容只存一次，账本本体因此不会膨胀） */\nfunction beforeImageDir(projectRoot, scopeRunId) {\n  const safe = String(scopeRunId || 'unscoped').replace(/[^A-Za-z0-9._-]/g, '_');\n  return path.join(path.resolve(projectRoot || '.'), '.codenode', 'runs', safe + '.before-images');\n}\n\n/**\n * 抓写操作执行**之前**的文件状态（Run 级回滚的依据）。\n *\n * 语义（判据见 scripts/run-rollback-test.cjs）：\n *   - 文件当时不存在 → `{ existed:false, restorable:true, delete:true }`（回滚 = 删掉它）；\n *   - 存在且 ≤ 256KB → 正文内容寻址存 blob，`{ existed:true, restorable:true, sha256, blob }`；\n *   - 存在但过大/不可读/不是普通文件 → `restorable:false` + 原因（**不假装能回滚**）。\n * @param {any} projectRoot\n * @param {string} scopeRunId\n * @param {string} relPath\n * @returns {any}\n */\nfunction captureBeforeImage(projectRoot, scopeRunId, relPath) {\n  const target = path.resolve(projectRoot || '.', String(relPath));\n  try {\n    const stat = fs.statSync(target);\n    if (!stat.isFile()) return { path: relPath, existed: true, restorable: false, reason: 'not-a-file' };\n    if (stat.size > BEFORE_IMAGE_CAP) {\n      return { path: relPath, existed: true, restorable: false, reason: 'too-large', bytes: stat.size };\n    }\n    const content = fs.readFileSync(target, 'utf8');\n    const sha256 = digest(content);\n    const dir = beforeImageDir(projectRoot, scopeRunId);\n    fs.mkdirSync(dir, { recursive: true });\n    const blob = path.join(dir, sha256 + '.txt');\n    if (!fs.existsSync(blob)) {\n      const tmp = blob + '.' + process.pid + '.tmp';\n      fs.writeFileSync(tmp, content);\n      fs.renameSync(tmp, blob);\n    }\n    return { path: relPath, existed: true, restorable: true, bytes: Buffer.byteLength(content), sha256, blob: sha256 + '.txt' };\n  } catch (error) {\n    if (error && error.code === 'ENOENT') return { path: relPath, existed: false, restorable: true };\n    return {\n      path: relPath,\n      existed: true,\n      restorable: false,\n      reason: 'unreadable:' + String((error && error.code) || (error && error.message) || 'unknown'),\n    };\n  }\n}\n\n/**\n * 行为者标签（S9）：`supervisor`（主代理）或 `task-xxx(role)`（子代理）。\n * 只做归因展示，**不参与幂等键** —— 幂等域仍然是 run，续跑的「已提交就跳过」语义必须保持。\n * 之前父子代理与多个子代理共用同一命名空间却没有任何归因，去重时会互相背锅（文案还说成\n * 「上一次中断前已提交」，与实际不符）。\n * @param {{taskId?: string, role?: string}} [actor]\n * @returns {string}\n */\nfunction actorLabel(actor) {\n  const a = actor || {};\n  const taskId = String(a.taskId || '').trim();\n  const role = String(a.role || '').trim();\n  if (!taskId) return role && role !== 'supervisor' ? '(role:' + role + ')' : 'supervisor';\n  return taskId + (role ? '(' + role + ')' : '');\n}\n\nfunction ledgerError(code, message, data = {}) {\n  return Object.assign(new Error(message), { code, retryable: false, ...data });\n}\n\nclass SideEffectLedger {\n  /**\n   * @param {object} options { projectRoot, scopeRunId, file, clock }\n   *   scopeRunId：幂等作用域。续跑时务必传「原 Run 的 runId」，否则去重失效（会重复产生副作用）。\n   */\n  constructor(options = {}) {\n    this.projectRoot = options.projectRoot || null;\n    this.scopeRunId = String(options.scopeRunId || 'unscoped');\n    this.file = options.file || (this.projectRoot ? ledgerPath(this.projectRoot, this.scopeRunId) : null);\n    /** @type {Map\u003cstring, any>} 按**路径**存的写前像（Run 级回滚用；见 begin/captureBeforeImage） */\n    this.beforeImages = new Map();\n    this.clock = options.clock || (() => new Date().toISOString());\n    this.records = new Map(); // idemKey -> record\n    this._load();\n  }\n\n  _load() {\n    if (!this.file || !fs.existsSync(this.file)) return;\n    try {\n      const parsed = JSON.parse(fs.readFileSync(this.file, 'utf8'));\n      if (!parsed || !Array.isArray(parsed.records) || parsed.records.some((record) =>\n        !record || typeof record.idemKey !== 'string' || !['read', 'write', 'unknown'].includes(record.effect) ||\n        !['pending', 'committed', 'failed', 'unknown'].includes(record.phase))) {\n        throw new Error('invalid ledger shape');\n      }\n      for (const record of parsed.records || []) this.records.set(record.idemKey, record);\n      // 前像是**按路径**存的（不是按记录）：同一路径被写多次时，回滚要回到「Run 开始前」那一份，\n      // 而记录是按 (工具,参数) 分键的 —— 存进记录里会被后续不同参数的写各存一份、互相覆盖。\n      for (const [relPath, image] of Object.entries(parsed.beforeImages || {})) {\n        this.beforeImages.set(relPath, image);\n      }\n    } catch {\n      // A corrupt recovery journal cannot prove that an earlier write did not run.\n      this.records.clear();\n      this.beforeImages.clear();\n      this.loadError = '账本解析失败；只读操作仍可执行，写操作需先修复或核对原账本';\n    }\n  }\n\n  /**\n   * 落盘。`effect` 为 `'read'` 时**直接跳过**（见下）。\n   *\n   * 为什么需要（#13）：`begin()`/`commit()`/`fail()` 对**每个**工具调用都会调这里，而它每次都把\n   * 整本账本 JSON 化 + `fsync` + rename —— 单次 Run 累计 n 次全量重写，写出的字节数约 **O(n²)**，\n   * 且全在 Electron 主进程的**同步**路径上（100 次调用就是数百毫秒到秒级的可感知卡顿，\n   * UI 与所有并发 run 一起被挡住）。\n   * 只读工具既不产生副作用、也不参与续跑去重（`begin` 的跳过分支要求 `effect === 'write'`），\n   * 它们的记录**没有崩溃恢复价值**：留在内存里供 review()/planResume 视图使用即可，\n   * 不必为此付一次 fsync。写与「结果未知」的副作用照旧同步落盘（那才是崩溃恢复要用的）。\n   * @param {'read'|'write'|'unknown'|undefined} effect\n   */\n  _persist(effect) {\n    if (!this.file) return;\n    if (effect === 'read') return;\n    try {\n      fs.mkdirSync(path.dirname(this.file), { recursive: true });\n      const records = [...this.records.values()];\n      const beforeImages = Object.fromEntries(this.beforeImages);\n      atomicWriteFile(this.file, JSON.stringify({ scopeRunId: this.scopeRunId, updatedAt: this.clock(), records, beforeImages }, null, 2));\n      this.persistError = null;\n    } catch (error) {\n      this.persistError = redact(String((error && error.message) || error)).slice(0, 500);\n      throw ledgerError('SYSTEM_ERROR', '副作用账本无法持久化，已停止依赖该账本的执行。', { ledgerPersistenceFailed: true });\n    }\n    // Observability is separate from the durable write. A bridge failure must not\n    // pretend that a successfully fsynced ledger was lost.\n    try {\n      const records = [...this.records.values()];\n      const latest = records.length ? records[records.length - 1] : null;\n      if (this.projectRoot) require('./eventBus.cjs').bridge(this.projectRoot, 'side_effect', {\n        runId: this.scopeRunId, records: records.length,\n        latest: latest ? { tool: latest.tool || null, phase: latest.phase || latest.status || null } : null,\n      });\n    } catch {\n      // The journal remains authoritative even when an observer is unavailable.\n    }\n  }\n\n  committedKey(scopeRunId, toolName, args) {\n    return this.records.has(idempotencyKey(scopeRunId || this.scopeRunId, toolName, args))\n      ? idempotencyKey(scopeRunId || this.scopeRunId, toolName, args)\n      : null;\n  }\n\n  /**\n   * 执行前登记意图；若同一幂等键已提交，返回 skip（续跑时不重复副作用）。\n   * @param {string} toolName\n   * @param {any} args\n   * @param {{taskId?: string, role?: string}} [actor] 行为者（S9）：主代理或子代理任务。\n   *   只影响归因记录与文案，幂等作用域不变。\n   */\n  begin(toolName, args, actor, options = {}) {\n    const effect = classify(toolName);\n    const key = idempotencyKey(this.scopeRunId, toolName, args);\n    const existing = this.records.get(key);\n    const who = actorLabel(actor);\n    if (effect !== 'read' && (this.loadError || this.persistError)) {\n      throw ledgerError('SYSTEM_ERROR', '副作用账本不可用，当前写操作未执行；请先检查账本。', { executed: false });\n    }\n    if (existing && (existing.phase === 'unknown' || effect !== 'read' && existing.phase === 'pending')) {\n      throw ledgerError('EFFECT_UNKNOWN', '同一操作已有未确认的执行记录，可能已生效；先只读核对状态，禁止盲目重放。', {\n        executed: false, sideEffectStatus: 'unknown', idemKey: key,\n      });\n    }\n    // 目标文件的**当前**状态指纹（只有带 path 的写操作才有）。\n    // 幂等键刻意**不含**它（改动键会让已落盘的账本对不上，续跑去重直接失效）；\n    // 它只用来回答一个问题：「现在跳过，还与当初提交时的世界一致吗？」\n    const statePath = args && typeof args.path === 'string' && args.path ? String(args.path) : '';\n    const currentDigest = statePath ? fileStateDigest(this.projectRoot, statePath) : '';\n    if (existing && existing.phase === 'committed' && effect === 'write') {\n      // 目标不可核对（参数里没有 path）而工具又声明「重复执行安全」→ 宁可真的再做一次。\n      // save_project 正是这一类：参数为空（键恒同），但画布/文件早就变了，\n      // 跳过它只会让用户看到「已保存」而磁盘停在旧版本。\n      const cannotVerify = !statePath && options.idempotent === true;\n      // 提交后记下的状态与现在不一致 → 期间被别人改过 → 跳过不安全（会覆盖/丢失那次改动）。\n      const targetChanged = !!statePath && !!existing.postStateDigest && currentDigest !== existing.postStateDigest;\n      if (!cannotVerify && !targetChanged) {\n        // 保持 committed 语义不变（只累计意图次数）：一旦降级回 pending，review()/planResume\n        // 就看不到「这条写已完成」，续跑只能整轮人工复核。去重路径不会再调用 commit()，\n        // 所以这里必须自己保住状态。\n        existing.intents = (existing.intents || 0) + 1;\n        existing.lastIntentAt = this.clock();\n        existing.lastActor = who;\n        this.records.set(key, existing);\n        this._persist(effect);\n        const prior = existing.actor || 'unknown';\n        return {\n          skip: true,\n          effect,\n          idemKey: key,\n          actor: who,\n          prior,\n          priorRecord: existing,\n          reason:\n            '该写操作在本次运行中已提交（幂等去重）—— 提交者 ' + prior + '，本次不再重复执行（请求方：' + who + '）',\n        };\n      }\n    }\n    const record = existing || { idemKey: key, tool: String(toolName), effect, argsDigest: digest(args), phase: 'pending', intents: 0 };\n    if (statePath) record.statePath = statePath;\n    record.phase = 'pending';\n    record.intents = (record.intents || 0) + 1;\n    record.lastIntentAt = this.clock();\n    if (!record.firstIntentAt) record.firstIntentAt = record.lastIntentAt;\n    // Run 级回滚的依据：写操作**第一次触碰该路径之前**抓一次前像，按**路径**保存 ——\n    // 回滚要回到「本次 Run 开始前」，而不是「上一次写之前」。判据见 scripts/run-rollback-test.cjs。\n    if (effect === 'write' && statePath && !this.beforeImages.has(statePath)) {\n      this.beforeImages.set(statePath, captureBeforeImage(this.projectRoot, this.scopeRunId, statePath));\n    }\n    record.actor = record.actor || who;\n    record.lastActor = who;\n    if (!Array.isArray(record.actors)) record.actors = [];\n    if (!record.actors.includes(who) && record.actors.length \u003c 5) record.actors.push(who);\n    this.records.set(key, record);\n    this._persist(effect);\n    return { skip: false, effect, idemKey: key, tool: String(toolName), actor: who, record };\n  }\n\n  commit(token, info = {}) {\n    if (!token || !token.idemKey) return null;\n    const record = this.records.get(token.idemKey) || { idemKey: token.idemKey, tool: token.tool, effect: token.effect };\n    record.phase = 'committed';\n    record.committedAt = this.clock();\n    record.ok = info.ok !== false;\n    record.digest = digest(info.resultDigest != null ? info.resultDigest : info.result || '');\n    if (token.actor) record.committedBy = token.actor;\n    if (info.reversible === true) record.reversible = true;\n    // 记下「这次写**之后**目标长什么样」：续跑时拿它与当前状态比对，一致才敢跳过。\n    // 必须取提交后的状态（写操作本身就会改变提交前的状态，拿前者比对必然不等）。\n    if (record.statePath) record.postStateDigest = fileStateDigest(this.projectRoot, record.statePath);\n    this.records.set(token.idemKey, record);\n    try { this._persist(record.effect); }\n    catch {\n      record.phase = 'unknown';\n      record.failureCode = 'EFFECT_UNKNOWN';\n      record.unknownAt = this.clock();\n      throw ledgerError('EFFECT_UNKNOWN', '工具已执行，但结果未能写入副作用账本；先只读核对状态，禁止盲目重放。', {\n        executed: true, sideEffectStatus: 'unknown', ledgerPersistenceFailed: true,\n      });\n    }\n    return record;\n  }\n\n  fail(token, error) {\n    if (!token || !token.idemKey) return null;\n    const record = this.records.get(token.idemKey) || { idemKey: token.idemKey, tool: token.tool, effect: token.effect };\n    const data = error && error.data || {};\n    const failure = error && error.failure || {};\n    const effectUnknown = failure.code === 'EFFECT_UNKNOWN' || data.code === 'EFFECT_UNKNOWN' ||\n      data.sideEffectStatus === 'unknown' || error && (error.code === 'EFFECT_UNKNOWN' || error.sideEffectStatus === 'unknown');\n    record.phase = effectUnknown ? 'unknown' : 'failed';\n    if (effectUnknown) {\n      record.failureCode = 'EFFECT_UNKNOWN';\n      record.unknownAt = this.clock();\n      if (typeof data.contractCode === 'string') record.contractCode = data.contractCode;\n    }\n    record.failedAt = this.clock();\n    if (token.actor) record.failedBy = token.actor;\n    // 脱敏（#15）：错误原文可能带凭据（命令回显 token、URL 里带 key 等）。\n    // `.codenode/runs/\u003crun>.side-effects.json` 是要长期留存的，而 runStore 那条路径已经脱敏 ——\n    // 这里漏掉就会让「日志已统一脱敏」的判断失真。统计字段（时长/退出码）不受影响。\n    record.error = redact(String((error && (error.text || error.message)) || error || '')).slice(0, 500);\n    this.records.set(token.idemKey, record);\n    this._persist(effectUnknown ? 'unknown' : record.effect);\n    return record;\n  }\n\n  /** 续跑时的核对视图：哪些副作用已提交 / 哪些做了但结果未知（含行为者归因）。 */\n  review() {\n    const committed = [];\n    const pending = [];\n    const unknown = [];\n    for (const record of this.records.values()) {\n      const item = {\n        tool: record.tool,\n        effect: record.effect,\n        idemKey: record.idemKey,\n        phase: record.phase,\n        at: record.committedAt || record.lastIntentAt || null,\n        actor: record.actor || null,\n        lastActor: record.lastActor || null,\n      };\n      // 先按 effect 分类：unknown（外部副作用，结果不可知）**永远**不算「已提交的写」。\n      // 否则 planResume 会把它塞进 skippable（文案写「续跑时跳过」），而执行期 begin() 的去重\n      // 只对 effect==='write' 生效 —— 结果就是「文案说跳过了、实际又跑了一遍」，\n      // 对 git push / npm publish 这类不可逆外部副作用就是重复执行。\n      // 注意：unknown 项仍带 phase 字段，消费者可区分「已提交的 unknown」与「未提交的 unknown」。\n      if (record.effect === 'unknown' || record.phase === 'unknown') unknown.push(item);\n      else if (record.phase === 'committed') committed.push(item);\n      else pending.push(item);\n    }\n    return { committed, pending, unknown };\n  }\n\n  /**\n   * 供「Run 级回滚」使用：列出本次 Run 里**带 path 的写操作**及其前像，按**首次意图时间**排序。\n   * 只读记录（effect!=='write'）与没有 path 的写（如 save_project）不参与回滚。\n   * @returns {Array\u003cany>}\n   */\n  recordsForRollback() {\n    const out = [];\n    for (const record of this.records.values()) {\n      if (record.effect !== 'write' || !record.statePath) continue;\n      out.push({\n        path: record.statePath,\n        tool: record.tool,\n        phase: record.phase,\n        actor: record.actor || null,\n        firstIntentAt: record.firstIntentAt || record.lastIntentAt || record.committedAt || null,\n        postStateDigest: record.postStateDigest || null,\n        // 前像按路径取（同一路径的多次写共用**最早**那一份）\n        beforeImage: this.beforeImages.get(record.statePath) || null,\n      });\n    }\n    return out.sort((a, b) => String(a.firstIntentAt || '').localeCompare(String(b.firstIntentAt || '')));\n  }\n\n  size() {\n    return this.records.size;\n  }\n}\n\n/** 供 AgentToolContext.sideEffectGuard 使用的守卫对象 */\nfunction createGuard(ledger) {\n  return {\n    begin: (toolName, args, actor, options) => ledger.begin(toolName, args, actor, options),\n    commit: (token, info) => ledger.commit(token, info),\n    fail: (token, error) => ledger.fail(token, error),\n    ledger,\n  };\n}\n\nmodule.exports = {\n  SideEffectLedger,\n  createGuard,\n  classify,\n  digest,\n  idempotencyKey,\n  canonicalArgsText,\n  fileStateDigest,\n  ledgerPath,\n  captureBeforeImage,\n  beforeImageDir,\n  BEFORE_IMAGE_CAP,\n  READ_TOOLS,\n  WRITE_TOOLS,\n  UNKNOWN_TOOLS,\n};\n","electron/requestBudget.cjs":"'use strict';\nconst { CostBudget } = require('./costBudget.cjs');\n/**\n * 请求前预算预留（防止单次运行把额度烧穿）。\n *\n * 估算规则（重要）：\n *   - 文本按 UTF-8 字节数估算（保守，偏大）；\n *   - **图片不能按字节算**：base64 是纯字节，一张 1MB 截图 ≈ 1.33M 字节，\n *     按字节当 token 会得出几百万 token，直接把 agent.max_total_tokens 顶爆，\n *     表现就是「请求前预算检查失败：额度不足」（代码节点带图对话必然触发）。\n *     图片改为按模型计费口径粗估（约 每 750 字节 ≈ 1 token），并设单张上限。\n *   - 输出按 max_tokens，重试按 reliability.maxAttempts 预留。\n */\n/** 单张图片的估算 token 上限（避免极端大图把预算吃光） */\nconst MAX_IMAGE_TOKENS = 4096;\n/** 图片字节 → 估算 token 的除数 */\nconst IMAGE_BYTES_PER_TOKEN = 750;\n\n/** 从消息内容里挑出图片 data URL */\nfunction collectImageUrls(messages) {\n  const out = [];\n  for (const msg of Array.isArray(messages) ? messages : []) {\n    const content = msg && msg.content;\n    if (!Array.isArray(content)) continue;\n    for (const part of content) {\n      if (part && part.type === 'image_url' && part.image_url && part.image_url.url) out.push(String(part.image_url.url));\n    }\n  }\n  return out;\n}\n\nfunction base64Bytes(dataUrl) {\n  const m = /^data:[^;]+;base64,(.*)$/.exec(String(dataUrl || ''));\n  if (!m) return String(dataUrl || '').length;\n  const b64 = m[1].replace(/\\s+/g, '');\n  const pad = /=+$/.exec(b64)?.[0].length ?? 0;\n  return Math.floor((b64.length * 3) / 4) - pad;\n}\n\n/**\n * 估算一次请求的输入 token：\n * 文本部分按字节；图片部分按「字节/750、单张上限」折算，不按 base64 长度算。\n */\nfunction estimateInputTokens(messages, tools) {\n  const images = collectImageUrls(messages);\n  // 估算体积时把图片 URL 换成占位符，避免 base64 被当成 token\n  const stripped = (Array.isArray(messages) ? messages : []).map((msg) => {\n    if (!msg || !Array.isArray(msg.content)) return msg;\n    return {\n      ...msg,\n      content: msg.content.map((part) =>\n        part && part.type === 'image_url'\n          ? { type: 'image_url', image_url: { url: '[image]' } }\n          : part,\n      ),\n    };\n  });\n  const textBytes = Buffer.byteLength(JSON.stringify({ messages: stripped, tools: tools || [] }), 'utf8');\n  const imageTokens = images.reduce(\n    (sum, url) => sum + Math.min(MAX_IMAGE_TOKENS, Math.ceil(base64Bytes(url) / IMAGE_BYTES_PER_TOKEN)),\n    0,\n  );\n  return textBytes + imageTokens + (Array.isArray(messages) ? messages.length * 32 : 0) + 256;\n}\n\nfunction usageTotal(usage) {\n  if (!usage || typeof usage !== 'object') return NaN;\n  if (usage.total_tokens != null) return Number(usage.total_tokens);\n  const input = usage.prompt_tokens ?? usage.input_tokens;\n  const output = usage.completion_tokens ?? usage.output_tokens;\n  if (input == null || output == null) return NaN;\n  return Number(input) + Number(output);\n}\n\nclass RequestBudget {\n  /**\n   * @param {number} limit\n   * @param {{parent?: RequestBudget|null, scope?: string, retryLimit?: number, costLimitUsd?: number, prices?: any}} [options]\n   *   parent：父预算（S9 父子链）。子代理的独立配额仍受父总量约束，不绕过 run 上限。\n   */\n  constructor(limit, options) {\n    const o = options || {};\n    this.limit = limit;\n    /** @type {RequestBudget|null} */\n    this.parent = o.parent || null;\n    /** 'run' | 'subagent'：仅用于错误提示与审计口径 */\n    this.scope = o.scope || 'run';\n    this.used = 0;\n    this.reserved = 0;\n    // Retry credits live at the run root. Child budgets delegate to their parent.\n    this.retryLimit = Number.isFinite(Number(o.retryLimit)) ? Math.max(0, Math.floor(Number(o.retryLimit))) : null;\n    this.retriesUsed = 0;\n    this.money = this.parent ? this.parent.money : new CostBudget({ limitUsd: o.costLimitUsd, prices: o.prices });\n  }\n\n  claimRetry() {\n    if (this.parent) return this.parent.claimRetry();\n    if (this.retryLimit == null) return null;\n    if (this.retriesUsed >= this.retryLimit) {\n      throw Object.assign(new Error('本次运行已达到模型请求重试上限（' + this.retryLimit + ' 次）'), {\n        code: 'RETRY_BUDGET_EXCEEDED', retryable: false,\n      });\n    }\n    this.retriesUsed += 1;\n    return this.retriesUsed;\n  }\n\n  /** 本层配额是否不够（只看自己，不碰父） */\n  wouldExceed(amount) {\n    return !Number.isFinite(amount) || amount \u003c 0 || this.used + this.reserved + amount > this.limit;\n  }\n\n  /** Atomically reserve both resources before a network request can start. */\n  reserveRequest(model, input, output, prices, options = {}) {\n    const tokenSettle = this.reserve(input + output);\n    let costSettle;\n    try {\n      costSettle = this.money.reserveTokens(model, options.costInputTokens == null ? input : options.costInputTokens, output, prices);\n    } catch (error) {\n      tokenSettle({ total_tokens: 0 });\n      throw error;\n    }\n    return (usage, options = {}) => {\n      tokenSettle(options.notSent ? { total_tokens: 0 } : usage);\n      costSettle(usage, options);\n    };\n  }\n\n  reserveFixedCost(amountUsd) { return this.money.reserveFixed(amountUsd); }\n  costSnapshot() { return this.money.snapshot(); }\n\n  reserve(amount) {\n    const fmt = (n) => Math.round(n).toLocaleString('en-US');\n    if (this.wouldExceed(amount)) {\n      throw Object.assign(\n        new Error(\n          `请求前预算检查失败：额度不足（本次需要约 ${fmt(amount)} tokens，` +\n            `已用 ${fmt(this.used)}、预留 ${fmt(this.reserved)}，上限 ${fmt(this.limit)}；` +\n            (this.scope === 'subagent'\n              ? '可在 config/agent.properties 调大 agent.subagent.max_total_tokens 后重启）'\n              : '可在 config/agent.properties 调大 agent.max_total_tokens 后重启）'),\n        ),\n        {\n          code: 'BUDGET_EXCEEDED',\n          scope: this.scope,\n          need: amount,\n          used: this.used,\n          reserved: this.reserved,\n          limit: this.limit,\n        },\n      );\n    }\n    // 父预算先预留（可能因 run 总量不足而抛；此时本层还没预留，回滚是干净的）\n    const parentSettle = this.parent ? this.parent.reserve(amount) : null;\n    this.reserved += amount;\n    let settled = false;\n    return (usage) => {\n      if (settled) return;\n      settled = true;\n      this.reserved -= amount;\n      // Missing usage or an uncertain failed request retains its full reservation.\n      const actual = usageTotal(usage);\n      const usedAmount = Number.isFinite(actual) && actual >= 0 ? actual : amount;\n      this.used += usedAmount;\n      // 父按**实际**用量结算（不是按预留额）：两个维度都反映真实消耗，父总量依然守恒\n      if (parentSettle) parentSettle({ total_tokens: usedAmount });\n    };\n  }\n}\n\n/**\n * 子代理的独立配额（S9）。\n *\n * 之前子代理直接用父 cfg，于是共用同一个 `RequestBudget`：一个子代理把额度刷穿，\n * 父 run 与其他子代理会被同一个 `BUDGET_EXCEEDED` 一起挡死，而且看不到是谁花的。\n * 现在每个子代理拿到自己的配额（`agent.subagent.max_total_tokens`），通过 parent 链\n * 把真实用量记进父 run 的总账：\n *   - 子代理超额 → 只有它自己失败，父与其他子代理继续；\n *   - 父 run 总量不足 → 仍然拦住（不绕过总预算）。\n * `limit \u003c= 0` 或没有父预算时返回父预算本身（不设独立配额 = S9 之前的行为，保持兼容）。\n *\n * @param {RequestBudget|null} parent\n * @param {number} limit\n * @returns {RequestBudget|null}\n */\nfunction createSubagentBudget(parent, limit) {\n  const n = Number(limit);\n  if (!parent || !Number.isFinite(n) || n \u003c= 0) return parent;\n  return new RequestBudget(n, { parent, scope: 'subagent' });\n}\n\nasync function withBudget(cfg, messages, tools, operation, attemptsRef) {\n  if (!cfg.requestBudget) return operation();\n  const input = estimateInputTokens(messages, tools);\n  const output = Number(cfg.maxTokens) || 8192;\n  const maxAttempts = Math.max(1, Math.min(5, Number(cfg.reliability?.maxAttempts) || 3));\n  // 预留按\"最坏情况\"（用满重试）保证不会被中途拒绝\n  const settle = cfg.requestBudget.reserve((input + output) * maxAttempts);\n  try {\n    const result = await operation();\n    const usage = result && result.usage;\n    const actual = usageTotal(usage);\n    if (Number.isFinite(actual) && actual >= 0) {\n      // 有明确 usage：按实际结算；若真的重试过，服务端对失败的尝试也计了输入费，\n      // 而 usage 只反映最后一次，按「实际重试次数」补偿这部分输入。\n      const usedAttempts = Math.max(1, Number(attemptsRef && attemptsRef.count) || 1);\n      const retryPenalty = usedAttempts > 1 ? input * (usedAttempts - 1) : 0;\n      settle({ total_tokens: actual + retryPenalty });\n    } else {\n      // 拿不到 usage（断流/异常）：保守按全额预留结算\n      settle(null);\n    }\n    return result;\n  } catch (error) {\n    settle(null);\n    throw error;\n  }\n}\n\n/**\n * Reserve and settle each actual HTTP attempt separately. A stream replay and\n * its inner HTTP retries share the same counter and the run-wide retry cap.\n * Unknown provider usage consumes the full reservation in the token budget,\n * while the cost ledger marks the visible estimate as billing-unknown.\n * @param {any} cfg\n * @param {any[]} messages\n * @param {any} tools\n * @param {() => Promise\u003cany>} operation\n * @param {any} attemptsRef\n */\nasync function withAttemptBudget(cfg, messages, tools, operation, attemptsRef) {\n  const ref = /** @type {any} */ (attemptsRef || { count: 0 });\n  const input = estimateInputTokens(messages, tools);\n  const output = Number(cfg && cfg.maxTokens) || 8192;\n  const budget = cfg && cfg.requestBudget;\n  const images = collectImageUrls(messages);\n  let costInputTokens = input;\n  if (images.length && budget && budget.costSnapshot().enabled) {\n    const perImage = cfg.costImageInputTokens && cfg.costImageInputTokens[cfg.model];\n    if (!Number.isSafeInteger(perImage) || perImage \u003c= 0) {\n      throw Object.assign(new Error('已启用费用硬上限：含图片请求须配置 cost.image_input_tokens.' + cfg.model + '，声明该模型每张图片的输入 Token 上界。'),\n        { code: 'COST_IMAGE_BOUND_MISSING', retryable: false });\n    }\n    // Image bytes / URL length are useful for coarse context estimates, but\n    // cannot bound visual billing. Add the declared per-model image ceiling.\n    costInputTokens += images.length * perImage;\n  }\n  /** @type {Set\u003cFunction>} */\n  const pending = new Set();\n  ref.beginAttempt = () => {\n    if (Number.isFinite(Number(ref.maxAttempts)) && ref.count >= Number(ref.maxAttempts)) {\n      throw Object.assign(new Error('本次模型调用已达到 HTTP 请求总次数上限（' + ref.maxAttempts + ' 次）'), {\n        code: 'REQUEST_ATTEMPT_LIMIT', retryable: false,\n      });\n    }\n    let settle = null;\n    try {\n      settle = budget ? budget.reserveRequest(cfg.model, input, output, cfg.costPrices, { costInputTokens }) : null;\n    } catch (error) {\n      if (error && typeof error === 'object') error.retryable = false;\n      throw error;\n    }\n    try {\n      if (ref.count > 0 && budget && typeof budget.claimRetry === 'function') budget.claimRetry();\n    } catch (error) {\n      if (settle) settle(null, { notSent: true });\n      if (error && typeof error === 'object') error.retryable = false;\n      throw error;\n    }\n    const number = ++ref.count;\n    const span = cfg.traceContext && cfg.traceProjectRoot ? require('./eventBus.cjs').startSpan(cfg.traceProjectRoot, {\n      spanKind: 'attempt', name: 'model.http', runId: cfg.costRunId || cfg.traceContext.runId,\n      parent: cfg.traceContext, actor: cfg.costKind || 'main', attemptId: String(number),\n      attributes: { model: cfg.model, number, reservedInputTokens: input, reservedOutputTokens: output },\n    }) : null;\n    ref.lastAttemptTraceContext = span && span.context || ref.lastAttemptTraceContext || cfg.traceContext || null;\n    const startedAt = Date.now();\n    let finished = false;\n    /** @param {any} usage @param {{failed?: boolean, partialChars?: number, cancelled?: boolean}} [details] */\n    const finish = (usage, details = {}) => {\n      if (finished) return;\n      finished = true;\n      pending.delete(finish);\n      const actual = usageTotal(usage);\n      // A failed stream may only contain the provider's initial input-usage\n      // frame. Treat it as incomplete even when it has a numeric total.\n      const known = details.failed !== true && Number.isFinite(actual) && actual >= 0;\n      if (settle) settle(known ? usage : null);\n      if (span) span.end(details.cancelled || cfg.traceSignal?.aborted ? 'cancelled' : details.failed ? 'error' : 'ok', {\n        model: cfg.model, usage: known ? usage : null,\n        attributes: { billingUnknown: !known, partialChars: Math.max(0, Number(details.partialChars) || 0) },\n      });\n      if ((details.failed || !usage) && cfg && cfg.costLedger && typeof cfg.costLedger.record === 'function') {\n        const visibleOutput = Math.min(output, Math.ceil(Math.max(0, Number(details.partialChars) || 0) / 4));\n        const estimate = known ? usage : {\n          prompt_tokens: input,\n          completion_tokens: visibleOutput,\n          total_tokens: input + visibleOutput,\n        };\n        try {\n          cfg.costLedger.record({\n            kind: details.failed ? 'failed-attempt' : 'usage-unknown',\n            model: cfg.model,\n            usage: estimate,\n            ok: details.failed !== true,\n            estimated: !known,\n            billingUnknown: !known,\n            attempt: number,\n            latencyMs: Date.now() - startedAt,\n            traceContext: span && span.context || cfg.traceContext || null,\n            runId: cfg.costRunId,\n            meta: {\n              perAttempt: true,\n              actor: cfg.costKind || 'main',\n              partialChars: Math.max(0, Number(details.partialChars) || 0),\n              reservedUpperBoundTokens: input + output,\n            },\n          });\n        } catch {}\n      }\n    };\n    pending.add(finish);\n    return finish;\n  };\n  try {\n    return await operation();\n  } finally {\n    for (const finish of [...pending]) finish(null, { failed: true, cancelled: cfg.traceSignal?.aborted === true });\n    delete ref.beginAttempt;\n  }\n}\n\nmodule.exports = { RequestBudget, createSubagentBudget, withBudget, withAttemptBudget, estimateInputTokens, collectImageUrls };\n","electron/costBudget.cjs":"'use strict';\n\n// Integer nanodollars keep concurrent reservations from drifting at the limit.\n// This is a guard against configured prices, not a claim about provider billing.\nconst SCALE = 1e9;\nconst MAX_LIMIT_USD = 1000000;\n\nfunction budgetError(code, message, details = {}) {\n  return Object.assign(new Error(message), { code, retryable: false, ...details });\n}\n\nfunction parseCostLimit(raw) {\n  if (raw == null || String(raw).trim() === '') return 0;\n  const value = Number(raw);\n  if (!Number.isFinite(value) || value \u003c 0 || value > MAX_LIMIT_USD || (value > 0 && value \u003c 0.000001)) {\n    throw budgetError('COST_CONFIG_INVALID', 'agent.max_cost_usd 必须是 0（关闭）或 0.000001 至 1000000 之间的美元金额');\n  }\n  return value;\n}\n\nfunction parseImageTokenBounds(properties = {}) {\n  const bounds = Object.create(null);\n  for (const [key, raw] of Object.entries(properties)) {\n    if (!key.startsWith('cost.image_input_tokens.')) continue;\n    const model = key.slice('cost.image_input_tokens.'.length).trim();\n    const value = Number(raw);\n    if (!model || !Number.isSafeInteger(value) || value \u003c= 0 || value > 4000000) {\n      throw budgetError('COST_CONFIG_INVALID', '图片费用上界必须是绑定实际模型的正整数 Token 数（最多 4000000）');\n    }\n    bounds[model] = value;\n  }\n  return bounds;\n}\n\nfunction count(value) {\n  return typeof value === 'number' && Number.isFinite(value) && value >= 0 ? value : null;\n}\n\nfunction priceFor(model, prices) {\n  const price = prices && prices[model];\n  if (!price || count(price.in) == null || count(price.out) == null ||\n      (price.cachedIn != null && count(price.cachedIn) == null)) {\n    throw budgetError('COST_PRICE_MISSING', '已启用费用硬上限，但模型 ' + model + ' 缺少有效单价；请配置 cost.price.' + model, { model });\n  }\n  return price;\n}\n\nfunction units(input, output, price) {\n  const amount = Math.ceil((input * price.in + output * price.out) * 1000);\n  if (!Number.isSafeInteger(amount) || amount \u003c 0) {\n    throw budgetError('COST_CONFIG_INVALID', '费用预留超出可安全计算的范围');\n  }\n  return amount;\n}\n\nfunction actualUnits(usage, price, reserved) {\n  if (!usage || usage.estimated === true) return reserved;\n  const input = count(usage.prompt_tokens ?? usage.input_tokens);\n  const output = count(usage.completion_tokens ?? usage.output_tokens);\n  if (input != null && output != null) {\n    const cached = count(usage.prompt_cache_hit_tokens ?? usage.prompt_tokens_details?.cached_tokens ?? usage.cache_read_input_tokens) || 0;\n    const cachedInput = Math.min(input, cached);\n    const ordinaryInput = input - cachedInput;\n    const cachePrice = price.cachedIn == null ? price.in : price.cachedIn;\n    const total = count(usage.total_tokens);\n    const unattributed = total == null ? 0 : Math.max(0, total - input - output);\n    // Some protocols report reasoning tokens only in total_tokens. Never free\n    // their reservation merely because the input/output split omitted them.\n    return units(ordinaryInput, output, price) + units(cachedInput, 0, { in: cachePrice, out: 0 }) +\n      units(unattributed, 0, { in: Math.max(price.in, price.out, cachePrice), out: 0 });\n  }\n  const total = count(usage.total_tokens);\n  // A total-only usage frame cannot establish the input/output split.\n  return total == null ? reserved : units(total, 0, { in: Math.max(price.in, price.out, price.cachedIn || 0), out: 0 });\n}\n\nclass CostBudget {\n  constructor(options = {}) {\n    this.limitUsd = parseCostLimit(options.limitUsd);\n    this.limit = Math.floor(this.limitUsd * SCALE);\n    this.prices = options.prices || {};\n    this.used = 0;\n    this.reserved = 0;\n    this.uncertainRequests = 0;\n  }\n\n  snapshot() {\n    return { enabled: this.limit > 0, limitUsd: this.limitUsd, usedUsd: this.used / SCALE,\n      reservedUsd: this.reserved / SCALE, uncertainRequests: this.uncertainRequests };\n  }\n\n  _reserve(amount) {\n    if (this.used + this.reserved + amount > this.limit) {\n      throw budgetError('COST_BUDGET_EXCEEDED', '本次运行的费用额度不足，已在模型请求发出前停止。', {\n        ...this.snapshot(), neededUsd: amount / SCALE,\n      });\n    }\n    this.reserved += amount;\n    let settled = false;\n    return (actual, uncertain) => {\n      if (settled) return;\n      settled = true;\n      this.reserved -= amount;\n      this.used += actual;\n      if (uncertain) this.uncertainRequests += 1;\n    };\n  }\n\n  reserveTokens(model, input, output, prices) {\n    if (!this.limit) return (_usage, _options = {}) => {};\n    if (count(input) == null || count(output) == null) throw budgetError('COST_CONFIG_INVALID', '费用预算的 Token 估算无效');\n    const price = priceFor(String(model || ''), prices || this.prices);\n    const upper = units(input, output, { in: Math.max(price.in, price.cachedIn || 0), out: price.out });\n    const settle = this._reserve(upper);\n    return (usage, options = {}) => {\n      if (options.notSent === true) return settle(0, false);\n      let actual = upper;\n      try { actual = actualUnits(usage, price, upper); } catch { /* retain the reservation on malformed usage */ }\n      const uncertain = !usage || usage.estimated === true ||\n        (count(usage.prompt_tokens ?? usage.input_tokens) == null || count(usage.completion_tokens ?? usage.output_tokens) == null) ||\n        Number(usage.total_tokens) > Number(usage.prompt_tokens ?? usage.input_tokens) + Number(usage.completion_tokens ?? usage.output_tokens);\n      settle(actual, uncertain);\n    };\n  }\n\n  reserveFixed(amountUsd) {\n    if (!this.limit) return () => {};\n    const amount = Number(amountUsd);\n    if (amountUsd == null || !Number.isFinite(amount) || amount \u003c 0) {\n      throw budgetError('COST_PRICE_MISSING', '费用硬上限已启用，重排请求需要显式配置每次请求的费用上界 rag.rerank_max_cost_usd');\n    }\n    const cost = Math.ceil(amount * SCALE);\n    if (!Number.isSafeInteger(cost)) throw budgetError('COST_CONFIG_INVALID', '重排请求费用上界无效');\n    const settle = this._reserve(cost);\n    return (notSent = false) => settle(notSent ? 0 : cost, !notSent);\n  }\n}\n\nmodule.exports = { CostBudget, parseCostLimit, parseImageTokenBounds, priceFor };\n","electron/atomicFile.cjs":"'use strict';\r\nconst fs = require('fs');\r\nconst path = require('path');\r\nconst { randomUUID } = require('crypto');\r\n/** 原子写：先写临时文件、fsync、再 rename，避免崩溃后留下半截文件。 */\r\n/**\r\n * @param {string} file\r\n * @param {string|Buffer} data\r\n * @param {BufferEncoding} [encoding]\r\n */\r\nfunction atomicWriteFile(file, data, encoding = 'utf8') {\r\n  const target = path.resolve(file);\r\n  fs.mkdirSync(path.dirname(target), { recursive: true });\r\n  const temporary = target + '.' + randomUUID() + '.tmp';\r\n  let fd = null;\r\n  try {\r\n    fd = fs.openSync(temporary, 'wx', 0o600);\r\n    fs.writeFileSync(fd, data, encoding);\r\n    fs.fsyncSync(fd);\r\n    fs.closeSync(fd);\r\n    fd = null;\r\n    fs.renameSync(temporary, target);\r\n  } finally {\r\n    if (fd != null) try { fs.closeSync(fd); } catch {}\r\n    if (fs.existsSync(temporary)) try { fs.unlinkSync(temporary); } catch {}\r\n  }\r\n}\r\nmodule.exports = { atomicWriteFile };\r\n","electron/ragSettings.cjs":"'use strict';\n\nconst fs = require('fs');\nconst path = require('path');\nconst { atomicWriteFile } = require('./atomicFile.cjs');\nconst { DEFAULTS, clearIndexCache } = require('./rag/index.cjs');\n\nconst KEYS = {\n  provider: 'rag.embed_provider',\n  model: 'rag.embed_model',\n  base: 'rag.embed_base',\n  dim: 'rag.embed_dim',\n  dimensions: 'rag.embed_dimensions',\n  backend: 'rag.vector_store',\n  key: 'rag.embed_key',\n  bm25K1: 'rag.bm25_k1',\n  bm25B: 'rag.bm25_b',\n  vectorWeight: 'rag.vector_weight',\n};\n\nfunction publicSettings(rag) {\n  return {\n    provider: rag.embedProvider,\n    model: rag.embedModel,\n    base: rag.embedBase,\n    dim: rag.embedDim,\n    dimensions: rag.embedDimensions,\n    backend: rag.vectorStore,\n    bm25K1: rag.bm25K1,\n    bm25B: rag.bm25B,\n    vectorWeight: rag.vectorWeight,\n    hasKey: !!rag.embedKey,\n    rerankEnabled: !!rag.rerankUrl,\n    rerankExternal: !!rag.rerankUrl && !/^https?:\\/\\/(localhost|127\\.0\\.0\\.1|\\[::1\\])(?=[:/]|$)/i.test(rag.rerankUrl),\n  };\n}\n\nfunction normalizedSettings(raw, existing) {\n  const input = raw && typeof raw === 'object' ? raw : {};\n  const provider = String(input.provider || '').trim().toLowerCase();\n  if (!['none', 'local', 'ollama', 'openai'].includes(provider)) throw new Error('嵌入提供方必须是 none、local、ollama 或 openai');\n  const backend = String(input.backend || '').trim().toLowerCase();\n  if (!['memory', 'sqlite'].includes(backend)) throw new Error('设置页仅支持 memory 或 sqlite；Milvus 请在配置文件中单独配置');\n  const dim = Number(input.dim);\n  if (!Number.isInteger(dim) || dim \u003c 256 || dim > 8192) throw new Error('向量维度必须在 256–8192 之间');\n  const bm25K1 = Number(input.bm25K1 == null ? existing.bm25K1 ?? DEFAULTS.bm25K1 : input.bm25K1);\n  const bm25B = Number(input.bm25B == null ? existing.bm25B ?? DEFAULTS.bm25B : input.bm25B);\n  const vectorWeight = Number(input.vectorWeight == null ? existing.vectorWeight ?? DEFAULTS.vectorWeight : input.vectorWeight);\n  if (!Number.isFinite(bm25K1) || bm25K1 \u003c 0.1 || bm25K1 > 3) throw new Error('BM25 k1 必须在 0.1–3 之间');\n  if (!Number.isFinite(bm25B) || bm25B \u003c 0 || bm25B > 1) throw new Error('BM25 b 必须在 0–1 之间');\n  if (!Number.isFinite(vectorWeight) || vectorWeight \u003c 0 || vectorWeight > 1) throw new Error('向量融合权重必须在 0–1 之间');\n  const dimensions = input.dimensions == null || String(input.dimensions).trim() === '' ? '' : String(input.dimensions).trim();\n  if (dimensions && (!/^\\d+$/.test(dimensions) || Number(dimensions) !== dim)) throw new Error('请求维度必须与索引维度一致');\n  const model = String(input.model || '').trim();\n  const base = String(input.base || '').trim().replace(/\\/+$/, '');\n  const key = String(input.key || '').trim() || String(existing.embedKey || '');\n  if (provider === 'ollama' || provider === 'openai') {\n    if (!model) throw new Error('语义模式需要填写嵌入模型');\n    let url;\n    try { url = new URL(base); } catch { throw new Error('嵌入服务地址无效'); }\n    if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password) throw new Error('嵌入服务地址须为不含账号密码的 HTTP(S) 地址');\n    if (provider === 'openai' && !key) throw new Error('OpenAI 兼容嵌入服务需要 API Key');\n  }\n  for (const value of [model, base, key]) if (/[\\r\\n]/.test(value)) throw new Error('配置值不能包含换行');\n  return { provider, backend: provider === 'none' ? 'memory' : backend, dim, dimensions: provider === 'openai' ? dimensions : '', model: provider === 'ollama' || provider === 'openai' ? model : '', base: provider === 'ollama' || provider === 'openai' ? base : '', key, bm25K1, bm25B, vectorWeight };\n}\n\nasync function checkSettings(settings) {\n  if (settings.backend === 'sqlite') {\n    try { require('node:sqlite'); require('sqlite-vec'); }\n    catch (error) { return { ok: false, error: 'SQLite 向量后端不可用：' + String(error && error.message || error).slice(0, 180) }; }\n  }\n  if (settings.provider === 'local' || settings.provider === 'none') return { ok: true, dimension: settings.dim, mode: settings.provider };\n  const controller = new AbortController();\n  const timer = setTimeout(() => controller.abort(), 8000);\n  try {\n    const url = settings.base + (settings.provider === 'ollama' ? '/api/embeddings' : '/embeddings');\n    const body = settings.provider === 'ollama'\n      ? { model: settings.model, prompt: 'CodeNode 检索配置测试' }\n      : { model: settings.model, input: ['CodeNode 检索配置测试'], ...(settings.dimensions ? { dimensions: Number(settings.dimensions) } : {}) };\n    const response = await fetch(url, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json', ...(settings.provider === 'openai' ? { Authorization: 'Bearer ' + settings.key } : {}) },\n      body: JSON.stringify(body),\n      signal: controller.signal,\n    });\n    if (!response.ok) return { ok: false, error: '嵌入端点 HTTP ' + response.status + '：' + (await response.text()).slice(0, 180) };\n    /** @type {any} */\n    const data = await response.json();\n    const vector = settings.provider === 'ollama' ? data.embedding : data.data && data.data[0] && data.data[0].embedding;\n    if (!Array.isArray(vector) || !vector.every(Number.isFinite)) return { ok: false, error: '嵌入端点未返回有效向量' };\n    if (vector.length !== settings.dim) return { ok: false, error: '模型实际返回 ' + vector.length + ' 维，与设置的 ' + settings.dim + ' 维不一致' };\n    return { ok: true, dimension: vector.length, mode: 'semantic' };\n  } catch (error) {\n    return { ok: false, error: '嵌入端点不可达：' + String(error && error.message || error).slice(0, 180) };\n  } finally { clearTimeout(timer); }\n}\n\nfunction writeSettings(projectRoot, settings, previous) {\n  const root = path.resolve(projectRoot);\n  if (!fs.statSync(root).isDirectory()) throw new Error('项目目录不存在');\n  const file = path.join(root, '.codenode', 'agent.properties');\n  const before = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '';\n  const entries = new Map([\n    [KEYS.provider, settings.provider], [KEYS.model, settings.model], [KEYS.base, settings.base],\n    [KEYS.dim, String(settings.dim)], [KEYS.dimensions, settings.dimensions], [KEYS.backend, settings.backend],\n    [KEYS.bm25K1, String(settings.bm25K1)], [KEYS.bm25B, String(settings.bm25B)],\n    [KEYS.vectorWeight, String(settings.vectorWeight)],\n  ]);\n  if (settings.key && settings.key !== previous.embedKey) entries.set(KEYS.key, settings.key);\n  const lines = before.split(/\\r?\\n/).filter((line) => {\n    const match = /^\\s*([^#!\\s][^=]*)=/.exec(line);\n    return !match || !entries.has(match[1].trim());\n  });\n  while (lines.length && !lines[lines.length - 1]) lines.pop();\n  lines.push('# CodeNode RAG 设置', ...[...entries].map(([key, value]) => key + '=' + value));\n  atomicWriteFile(file, lines.join('\\n') + '\\n');\n  clearIndexCache();\n  return { ok: true, rebuildRequired: true };\n}\n\nmodule.exports = { publicSettings, normalizedSettings, checkSettings, writeSettings };\n"},"cases":[{"id":"S31","query":"登记在 WRITE_TOOLS 中的工具如何分类？","sources":[{"citation":"electron/sideEffects.cjs#L42-L49","path":"electron/sideEffects.cjs","startLine":42,"endLine":49,"excerpt":"  const name = String(toolName || '').trim();\n  if (!name) return 'unknown';\n  if (READ_TOOLS.has(name)) return 'read';\n  if (WRITE_TOOLS.has(name)) return 'write';\n  if (UNKNOWN_TOOLS.has(name)) return 'unknown';\n  // 未登记的工具按最保守处理：未知副作用\n  return 'unknown';\n}","anchor":"if (WRITE_TOOLS.has(name)) return 'write'","domai
