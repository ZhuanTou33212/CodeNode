<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeNode Canvas</title>
  <link rel="stylesheet" href="canvas.css">
</head>
<body>
  <header class="toolbar">
    <strong>CodeNode Canvas</strong>
    <span class="toolbar-hint">拖拽节点，连接兼容端口；滚轮缩放，空格+拖拽平移</span>
    <button id="add-node">+ 空白节点</button>
    <label class="toolbar-select-label" for="build-select">打板制作</label>
    <select id="build-select" class="toolbar-select" aria-label="选择打板制作方式">
      <option value="">选择制作方式</option>
      <option value="node">制作成节点</option>
      <option value="program">制作成程序</option>
    </select>
    <button id="choose-location">选择保存位置</button>
    <span id="location-status" class="location-status">未选择位置</span>
    <label class="language-select-label" for="language-select">语言</label>
    <select id="language-select" class="language-select" aria-label="选择语言">
      <option value="java">Java</option>
      <option value="powershell">PowerShell</option>
    </select>
    <button id="fit-view">适配视图</button>
    <button id="clear-canvas">清空</button>
  </header>
  <main class="app-shell">
    <section id="canvas" class="canvas" aria-label="节点画布" tabindex="0">
      <svg id="edges" class="edges" aria-hidden="true"></svg>
      <div id="nodes" class="nodes"></div>
      <div id="empty-state" class="empty-state" hidden></div>
    </section>
    <aside class="inspector" aria-label="节点检查器">
      <h2>检查器</h2>
      <p id="selection-hint">选择一个节点查看详情。</p>
      <label>名称<input id="node-name" disabled></label>
      <label>制作要求<textarea id="node-prompt" rows="4" disabled></textarea></label>
      <p id="node-language" class="status">语言：Java</p>
      <button id="make-node" class="make-button" disabled>制作节点</button>
      <label>代码预览<textarea id="node-code" rows="8" readonly></textarea></label>
      <p id="node-status" class="status">状态：—</p>
      <p id="validation-message" class="validation"></p>
    </aside>
  </main>
  <script src="canvas.js"></script>
</body>
</html>
