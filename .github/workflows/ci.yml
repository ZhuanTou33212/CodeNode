name: CodeNode CI

# 触发：所有分支的 push、所有 PR、手动触发。
# 不再写死分支名——历史上这里写死过 n0_12，分支一改名 CI 就静默失效了（门禁形同虚设）。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 版本单一来源：.nvmrc（与 package.json engines 保持一致）
          node-version-file: .nvmrc
          cache: npm
      - name: 缓存 Electron 二进制（Electron 与 electron-builder 都要从 GitHub 下载；
          # 网络一抖就 fetch failed → 作业假红，2026-09-16 windows 上实测红过一次）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
            ~/.cache/electron-builder
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - name: 安装依赖（package-lock.json 可用，使用 npm ci）
        run: npm ci
      - name: 构建（Linux：xvfb 提供显示环境；容器里需关闭 Electron 沙箱才能重建图标）
        if: runner.os == 'Linux'
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a npm run build
      - name: 构建（Windows / macOS）
        if: runner.os != 'Linux'
        run: npm run build
      - name: 静态检查（Electron 主进程 / 工具层 / 脚本，checkJs）
        run: npm run check:js
      - name: 回归 + 门禁（统一入口：含 production-gate / runtime-gate / 执行隔离 / 断点续跑 / 成本账本 / Agent 评测）
        run: npm test
      - name: 上传评测报告（JSON + Markdown，绑定 commit/模型/参数/数据集版本）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-${{ runner.os }}
          path: docs/eval-reports/
          if-no-files-found: warn
      - name: Electron smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a npm run test:smoke

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
          - os: macos-latest
            command: npm run dist:mac
          - os: ubuntu-latest
            command: npm run dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 缓存 Electron 二进制（Electron 与 electron-builder 都要从 GitHub 下载；
          # 网络一抖就 fetch failed → 作业假红，2026-09-16 windows 上实测红过一次）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
            ~/.cache/electron-builder
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - run: npm ci
      # Linux 打包前会先跑 npm run build（postbuild 的 icons:build 要启 Electron）：
      # 容器里没有 setuid chrome-sandbox，必须在**进程启动前**用环境变量关掉沙箱，否则 FATAL 直接退出；
      # 渲染图标还需要显示环境，所以同样套 xvfb-run。
      - name: 打包（Linux：xvfb + 关闭 Electron 沙箱）
        if: runner.os == 'Linux'
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a ${{ matrix.command }}
      - name: 打包（Windows / macOS）
        if: runner.os != 'Linux'
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: codenode-${{ runner.os }}
          path: release/*
          if-no-files-found: error
