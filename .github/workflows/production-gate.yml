name: production-gate

# 触发：所有分支的 push / 所有 PR / 手动。
# 之前 push 与 PR 都写死 branches: [n0_12]，分支改名后这个工作流再也不会运行——
# 门禁"存在但永不触发"比没有门禁更危险，这里改成不带分支过滤。
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'gate=离线门禁（默认）；release=发布模式（必须提供评测 Key 与签名凭据，缺失即失败）'
        required: true
        default: gate
        type: choice
        options:
          - gate
          - release

permissions:
  contents: read

jobs:
  # fail-closed 前置校验：发布模式缺少必需凭据时直接失败，绝不以成功码跳过。
  credentials:
    name: 凭据前置校验（fail-closed）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - name: 解析本次运行模式
        id: mode
        env:
          INPUT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'gate' }}
        run: |
          if [ "${INPUT_MODE}" = "release" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "本次运行：release（发布模式，凭据必须齐全）"
          else
            echo "mode=gate" >> "$GITHUB_OUTPUT"
            echo "本次运行：gate（离线门禁模式，不要求发布凭据）"
          fi
      - name: 发布模式凭据检查（缺一即失败）
        if: steps.mode.outputs.mode == 'release'
        env:
          CODENODE_EVAL_API_KEY: ${{ secrets.CODENODE_EVAL_API_KEY }}
          CODENODE_E2E_API_KEY: ${{ secrets.CODENODE_E2E_API_KEY }}
          CODENODE_WIN_CERT_PFX_BASE64: ${{ secrets.CODENODE_WIN_CERT_PFX_BASE64 }}
          CODENODE_WIN_CERT_PASSWORD: ${{ secrets.CODENODE_WIN_CERT_PASSWORD }}
        run: |
          missing=""
          [ -n "${CODENODE_EVAL_API_KEY}" ] || missing="${missing} CODENODE_EVAL_API_KEY"
          [ -n "${CODENODE_E2E_API_KEY}" ] || missing="${missing} CODENODE_E2E_API_KEY"
          [ -n "${CODENODE_WIN_CERT_PFX_BASE64}" ] || missing="${missing} CODENODE_WIN_CERT_PFX_BASE64"
          [ -n "${CODENODE_WIN_CERT_PASSWORD}" ] || missing="${missing} CODENODE_WIN_CERT_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error::发布模式缺少必需凭据：${missing}（fail-closed：不允许无凭据静默通过）"
            exit 1
          fi
          echo "发布凭据齐全：评测 Key 与 Windows 签名证书均已配置"

      - name: 评测 Key 是否配置（决定 PR 上的真机子集是否运行）
        id: key
        env:
          CODENODE_EVAL_API_KEY: ${{ secrets.CODENODE_EVAL_API_KEY }}
        run: |
          if [ -n "${CODENODE_EVAL_API_KEY}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "已配置 CODENODE_EVAL_API_KEY：PR/push 将运行真机子集（--subset=pr，3 个便宜任务）"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "未配置 CODENODE_EVAL_API_KEY：不运行 PR 真机子集（fork PR 拿不到 secrets，属预期；离线门禁照常）"
          fi

  gate:
    name: Gate (${{ matrix.os }})
    needs: credentials
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 构建（Linux 用 xvfb；容器里需关闭 Electron 沙箱才能重建图标）
        if: runner.os == 'Linux'
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a npm run build
      - name: 构建（Windows / macOS）
        if: runner.os != 'Linux'
        run: npm run build
      - name: 静态检查（checkJs）
        run: npm run check:js
      # 统一入口：门禁清单只在 scripts/run-all-tests.cjs 里定义一次，
      # 与 ci.yml 完全一致（避免"两个 workflow 跑不同集合"的历史问题）。
      - name: 离线门禁与回归（core 套件）
        run: npm test
      - name: 上传评测报告（三平台各一份，含失败与跳过清单）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-${{ runner.os }}
          path: docs/eval-reports/
          if-no-files-found: warn

  # 真机回归挂 PR：仓库里配了评测 Key 就在 PR/push 上跑**便宜子集**（--subset=pr，3 个任务）。
  # 动机：真机评测此前只在手动 release 模式跑 → electron/** 的改动要等到发布前才第一次见真机，
  # 而历史上有两类缺陷（真实流分片把参数切碎、窗口口径）**只在真机上暴露、离线永远全绿**。
  # fork PR 拿不到 secrets → has_key=false → 本 job 不出现（属预期，不是静默放行：离线门禁照常跑）。
  model-eval-pr:
    name: 真实模型回归（PR 子集，fail-closed）
    needs: credentials
    if: needs.credentials.outputs.mode == 'gate' && needs.credentials.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 真机子集评测（--subset=pr --require-model：无 Key 直接非 0 退出）
        run: npm run test:eval:model:pr
        env:
          CODENODE_EVAL_API_KEY: ${{ secrets.CODENODE_EVAL_API_KEY }}
          CODENODE_EVAL_BASE_URL: ${{ vars.CODENODE_EVAL_BASE_URL }}
          CODENODE_EVAL_MODEL: ${{ vars.CODENODE_EVAL_MODEL }}
      - name: 上传真机子集评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-model-pr
          path: docs/eval-reports/
          if-no-files-found: warn

  # 真实模型评测：只在发布模式下运行，且必须已通过凭据前置校验。
  model-eval:
    name: 真实模型评测（发布模式，fail-closed）
    needs: credentials
    if: needs.credentials.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 真实模型多步评测（--require-model：无 Key 直接非 0 退出）
        run: npm run test:eval:model
        env:
          CODENODE_EVAL_API_KEY: ${{ secrets.CODENODE_EVAL_API_KEY }}
          CODENODE_EVAL_BASE_URL: ${{ vars.CODENODE_EVAL_BASE_URL }}
          CODENODE_EVAL_MODEL: ${{ vars.CODENODE_EVAL_MODEL }}
      - name: 上传真实模型评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report-model
          path: docs/eval-reports/
          if-no-files-found: warn

  provider-smoke:
    name: 供应商连通性 smoke（fail-closed）
    needs: credentials
    if: ${{ vars.PROVIDER_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:provider-smoke
        env:
          CODENODE_E2E_REQUIRED: 'true'
          CODENODE_E2E_API_KEY: ${{ secrets.CODENODE_E2E_API_KEY }}
          CODENODE_E2E_API_BASE: ${{ vars.CODENODE_E2E_API_BASE }}
          CODENODE_E2E_MODEL: ${{ vars.CODENODE_E2E_MODEL }}
          # S13：真实供应商冒烟也可切到 Claude / Gemini 原生或 Azure 端点（留空 = OpenAI 兼容档）
          CODENODE_E2E_PROTOCOL: ${{ vars.CODENODE_E2E_PROTOCOL }}
          CODENODE_E2E_AUTH: ${{ vars.CODENODE_E2E_AUTH }}
          CODENODE_E2E_ENDPOINT: ${{ vars.CODENODE_E2E_ENDPOINT }}
