name: production-gate

on:
  push:
    branches: [n0_12]
  pull_request:
    branches: [n0_12]

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run build
      - if: runner.os != 'Linux'
        run: npm run build
      - run: npm run test:security
      - run: npm run test:run-store
      - run: npm run test:bridge
      - run: npm run test:agent-boundary
      - run: npm run test:request-budget
      - run: npm run test:production-gate
      - run: npm run test:agent-reliability
      - run: npm run test:rag
      - run: npm run test:scalar
      - run: npm run test:model
      - run: npm run test:cache
      - run: npm run test:bg
      - run: npm run test:subagent

  provider-smoke:
    if: ${{ vars.PROVIDER_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:provider-smoke
        env:
          CODENODE_E2E_REQUIRED: 'true'
          CODENODE_E2E_API_KEY: ${{ secrets.CODENODE_E2E_API_KEY }}
          CODENODE_E2E_API_BASE: ${{ vars.CODENODE_E2E_API_BASE }}
          CODENODE_E2E_MODEL: ${{ vars.CODENODE_E2E_MODEL }}
