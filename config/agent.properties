# 复制为 config/agent.properties 并填写 api_key（已 skip-worktree，不入库）
api_base=https://api.deepseek.com
api_key=
model=deepseek-chat
# 思考链 token 与正文共用这笔额度：8192 在开思考链时会把长回答砍半（实测），提到 32768
max_tokens=32768
soul_file=config/soul.md

# ── RAG 检索增强（三层：BM25 词法 / 向量语义 / 标量库）────────────────────────
rag.enabled=true
rag.embed_top_k=40            # 向量层候选上限（milvus 后端下即 ANN topk）
rag.vector_weight=0.4         # 向量分融合权重（0~1）

# 向量层（嵌入）：生产档为真嵌入 1024 维。下面三项填好并去掉 # 即切到真嵌入；
# 本机离线可用 llama.cpp 的 OpenAI 兼容服务做同样的事：
#   llama-server -m bge-m3-Q8_0.gguf --embeddings --pooling cls --ctx-size 8192
# rag.embed_provider=openai
# rag.embed_base=http://<嵌入服务地址>:8080/v1
# rag.embed_model=bge-m3           # 原生 1024 维；用 openai text-embedding-3-* 时另设 rag.embed_dimensions=1024
# rag.embed_key=                    # 本地服务填任意非空值
# rag.embed_dim=1024                # local 哈希向量默认 4096，真嵌入按模型维度（bge-m3=1024）

# 向量后端：memory（默认，进程内、零外部依赖）| milvus（外部 ANN，需 npm i @zilliz/milvus2-sdk-node）
rag.vector_store=memory
# ↓ Milvus 生产档（百万级 / 1024 维 / HNSW）：填好 address 后把上面的 vector_store 改为 milvus 即启用
# rag.milvus_address=http://<Milvus 地址>:19530    # 分布式部署填 LB / proxy 入口；读写分离在服务端
# rag.milvus_token=                                # Zilliz Cloud / 开启鉴权的服务端
# rag.milvus_username=
# rag.milvus_password=
# rag.milvus_collection=                           # 留空 = codenode_rag_<目录名>_<hash8>
# rag.milvus_consistency=strong                    # strong（默认：刚改完文件立即可见）| bounded（分布式更省延迟）
# rag.milvus_index_type=HNSW                       # HNSW（生产档）| AUTOINDEX | IVF_FLAT ...
# rag.milvus_metric_type=COSINE
# rag.milvus_index_m=16
# rag.milvus_index_ef_construction=200
# rag.milvus_search_ef=64                          # HNSW 检索 ef，须 ≥ 召回条数
# rag.milvus_batch_size=128                        # 单批嵌入+写入条数（百万级写入靠它控请求数与内存）
# rag.milvus_flush_every_batches=4                 # 每 N 批 flush 一次（收尾必刷；逐批 flushSync 在百万级下过贵）

# ── 工具调度（S6）──────────────────────────────────────────────────────
# tools.parallel=false                           # 只读并行（默认关：行为与串行一致）
# tools.parallel_concurrency=3                   # 只读并行并发上限（1–8）

# ── 审批（S7）──────────────────────────────────────────────────────────
# tools.confirm_writes=true                      # 确认类工具执行前需用户批准（默认开；false = 整体关闭）
# agent.approval.ttl_ms=300000                   # 审批令牌有效期（默认 5 分钟，单次有效）

# ── 工具结果压缩（那一次「子代理压缩」调用）的成本控制（S9）────────────────────────
# 压缩请求 = 固定前缀 + 本次工具结果原文，服务端前缀缓存只能命中前缀 → 命中率天然很低。
# 下面几项把它变成可控成本：内容级缓存（同原文只压一次，可跨 run 复用）、system 恒定前缀、
# 可换便宜模型、默认关思考链（摘要/搬运任务不需要 reasoning tokens）。
# agent.compression.cache=true                   # 内容级缓存（默认开）
# agent.compression.batch=true                   # 同一轮多份大结果合并成一次压缩请求（默认开）
# agent.compression.batch_max_items=4             # 单批最多几份结果（按条数切分）
# agent.compression.model=                       # 压缩专用模型（留空 = 跟随主模型）
# agent.compression.reasoning=false              # 压缩是否开思考链（默认关）
# agent.compression.max_output_tokens=4096
# agent.compression.timeout_ms=60000

# ── 子代理（delegate_task / delegate_tasks）的预算与结果契约（S9）─────────────────
# agent.subagent.max_total_tokens=0              # 单个子代理的独立配额（0 = 共享父预算；两者都受 agent.max_total_tokens 约束）
# agent.subagent.total_timeout_seconds=600       # 单个子代理任务的**总时长**（runAgentChat 的 timeoutMs 是单轮超时，两者不同）
# agent.subagent.result_max_chars=8000           # 回灌主上下文的子代理结果上限（超出截断，完整结果用 get_subagent_task 查）
# agent.subagent.max_tasks_per_run=12
# agent.subagent.max_batch_tasks=8

# ── shell 权限边界（S12）──────────────────────────────────────────────
# execute_shell 的**越界写**（写到允许写的根之外）在能力层直接拒绝，不靠用户点确认 ——
# Windows 后端不隔离文件系统，光靠「用户点同意」兜不住（确认文案也说不清会写到哪）。
# 允许写的根 = 项目目录 + 下面这项 + 系统临时目录；确实需要写到别处时显式放开：
# sandbox.allow_write=E:/some/dir                 # 额外可写目录（逗号分隔；会进入策略的 writeRoots）
# sandbox.network=deny                            # 切断网络：疑似联网的命令（URL / git push|clone / npm install / npx…）直接拒绝

# ── 运行上限（P5）─────────────────────────────────────────────────────
# agent.max_tool_iterations=12                    # 单次运行最多几轮模型调用（默认 12）
# agent.max_total_tool_calls=100                  # 单次运行最多执行几次工具调用（默认 100）
# agent.data_truncate_cap=120000                  # 单条工具结果回灌上下文的正文字符上限（默认 12 万）

# ── 来源校验门（S10/P6）───────────────────────────────────────────────
# agent.grounding.mode=warn                       # warn=只上报（默认，行为不变）；enforce=引用不可信不允许直接交付
# agent.grounding.max_retries=1                   # enforce 下最多让模型订正几次（仍不达标则回 groundingBlocked 并如实上报）
